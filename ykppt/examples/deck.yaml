pages:
  # ---------------- 封面 ----------------
  - type: cover
    title: 面向泛在人机物资源协同运行时编程模型
    presenter: 孙愉祥
    advisor: 陈亚兴老师
    date: 2026年7月31日

  # ---------------- 目录 ----------------
  - type: toc

  # ---------------- 一、研究背景 ----------------
  - type: toc
    current: 研究背景

  - type: lead
    section: 一、研究背景
    title: 人机物融合系统
    lead: 软件系统正由传统信息物理系统向〔人机物融合系统（HCPS）〕转变，管理对象从海量分布式资源扩展到跨越云、边、端的三元异构实体。
    conclusion: 资源间的关联特性正成为影响系统执行效率的关键因素。

  - type: bullets
    section: 一、研究背景
    title: HCPS 任务的三个特征
    lead: 任务不再只是"需要哪些资源"，而是"哪些资源能一起把事做完"。
    bullets:
      - 〔异构协同性〕：一个任务通常由多类资源协同完成，不仅要具备资源，还要求资源之间能形成有效协同。
      - 〔动态性〕：资源、关系与执行过程都在变化，任务必须依据当前状态继续推进。
      - 〔关系依赖〕：任务链上的角色之间存在时序、数据与地理上的强约束。
    conclusion: 现有调度只回答"选哪些节点"，不回答"这些节点是否适合一起干"。

  - type: cards
    section: 一、研究背景
    title: 亲和性与局部性
    lead: 亲和性判断资源是否〔适合〕协作，局部性判断跨域协作〔代价〕是否可接受。
    cards:
      - head: 亲和性
        text: 不同类型资源在功能互补、交互频度、依赖强度和历史协作上的协同倾向，用于回答"哪些资源更适合共同执行一个任务"。
      - head: 局部性
        text: 不同资源在通信时延、部署范围、网络路径和管理边界上的接近程度，用于回答"这些资源协同执行时需要付出多大的跨域协作代价"。
    conclusion: 现有运行时缺少对二者的持续对象化管理。

  - type: table
    section: 一、研究背景
    title: 现有系统的核心抽象
    lead: 三类系统各自解决了一部分问题，但都没有把"关系"变成一等公民。
    table:
      x: 300
      width: 720
      head: [系统, 核心抽象, 缺失]
      rows:
        - [ServiceOS, 单设备资源服务, 跨设备关系]
        - [LegoOS, 原子化资源组件, 组件间协作]
        - [AIOS, LLM 智能体, 资源结构表达]
    conclusion: 关系信息分散在调度器与业务代码里，运行时无法持续检查。

  # ---------------- 二、相关工作 ----------------
  - type: toc
    current: 相关工作

  - type: cards
    section: 二、相关工作
    title: 关联资源的整体化组织
    lead: 现有研究把有关联的资源组织为复合对象、集合、拓扑或执行图。
    cards:
      - head: ASRE
        text: 将容器、消息代理等跨边云异构资源，组织为面向特定应用的资源集合，并支持连接管理、监控、弹性调整和资源替换。
      - head: TOSCA
        text: 通过节点、需求、能力和关系描述服务结构，将分散的资源与服务组织为服务表示图，并支持部署时的更新。
    conclusion: 能整体组织资源，但任务仍需直接协调内部成员及其关系。

  - type: flow
    section: 二、相关工作
    title: 研究缺口
    lead: 三条线索各自成立，合起来恰好缺一个"任务可用"的资源对象。
    steps:
      - {text: 关系没有成为持续维护的资源结构, tag: 表达缺失}
      - {text: 资源整体缺少面向任务的统一调用抽象, tag: 组织缺失}
      - {text: 角色活动状态仍与具体执行资源绑定, tag: 状态耦合}
    conclusion: 缺的不是调度算法，而是一个能被任务稳定持有的运行时对象。

  # ---------------- 三、研究内容 ----------------
  - type: toc
    current: 研究内容

  - type: flow
    section: 三、研究内容
    title: 研究思路
    lead: 从关系闭包到对象调用，再到跨资源连续执行，三步递进。
    steps:
      - {text: 关系闭合的资源结构, tag: 对象化}
      - {text: HyperContainer, tag: 整体调用}
      - {text: 跨资源连续执行, tag: 状态解耦}
    conclusion: 三步分别对应类型、实例与执行三个层面。

  - type: flow_h
    section: 三、研究内容
    title: 三级对象模型
    lead: 类型、候选、实例三层分工，把"能不能配"和"配没配上"分开。
    steps:
      - {text: HCType 声明角色与关系约束}
      - {text: HCCandidate 给出满足约束的候选}
      - {text: HCInstance 真正占有资源}
      - {text: 方法调用解析为角色活动}
    conclusion: 提出 HCType—HCCandidate—HCInstance 三级模型。

  - type: lead
    section: 三、研究内容
    title: 编程模型
    lead: 任务只持有稳定的 HCInstance，通过对象方法表达资源操作，由运行时把调用解析为角色活动，并在当前实现代次上协调成员绑定与关系实现。
    conclusion: 任务控制语义与异构资源协同实现就此解耦。

  # ---------------- 四、总结与展望 ----------------
  - type: toc
    current: 总结与展望

  - type: bullets
    section: 四、总结与展望
    title: 阶段总结
    lead: 已完成模型与编程接口，正在补执行语义与原型验证。
    bullets:
      - 提出关系闭合的资源结构与三级对象模型，统一表达角色、关系与实例。
      - 设计对象中心编程接口，把跨资源协同从业务代码收进运行时。
      - 完成候选发现与实例化的准备—验证—发布机制。
    conclusion: 下一步是把执行语义补齐，并用原型验证通信开销与并行收益。

  - type: close
